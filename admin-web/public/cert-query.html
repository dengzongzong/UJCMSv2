<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>证书查询 - 国际职业能力标准人才评测网</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #1f2d3d 0%, #324157 50%, #1f2d3d 100%);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 16px;
    }
    .container {
      width: 100%;
      max-width: 860px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #409eff 0%, #1d6fd0 100%);
      color: #fff;
      padding: 28px 32px;
      text-align: center;
    }
    .header h1 { font-size: 24px; margin-bottom: 6px; }
    .header p { font-size: 14px; opacity: 0.9; }
    .body { padding: 28px 32px; }
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block;
      font-size: 14px;
      color: #606266;
      margin-bottom: 6px;
      font-weight: 500;
    }
    .form-group input {
      width: 100%;
      height: 42px;
      padding: 0 14px;
      border: 1px solid #dcdfe6;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus { border-color: #409eff; }
    .form-row { display: flex; gap: 12px; }
    .form-row .form-group { flex: 1; }
    .tip { font-size: 12px; color: #909399; margin-top: 4px; }
    .btn-search {
      width: 100%;
      height: 44px;
      background: #409eff;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 8px;
    }
    .btn-search:hover { background: #1d6fd0; }
    .btn-search:disabled { background: #a0cfff; cursor: not-allowed; }
    .result-area { margin-top: 24px; }
    .empty {
      text-align: center;
      color: #909399;
      padding: 40px 0;
      font-size: 14px;
    }
    .cert-card {
      border: 1px solid #ebeef5;
      border-radius: 8px;
      padding: 18px 20px;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }
    .cert-card .name-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px dashed #ebeef5;
    }
    .cert-card .name { font-size: 18px; font-weight: 600; color: #303133; }
    .cert-card .cert-no { font-size: 13px; color: #409eff; }
    .cert-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 24px;
      font-size: 13px;
    }
    .cert-grid .k { color: #909399; }
    .cert-grid .v { color: #303133; }
    .cert-actions { margin-top: 14px; display: flex; gap: 10px; }
    .btn-dl {
      padding: 7px 16px;
      border: 1px solid #409eff;
      background: #fff;
      color: #409eff;
      border-radius: 5px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      display: inline-block;
    }
    .btn-dl:hover { background: #409eff; color: #fff; }
    .footer {
      text-align: center;
      padding: 16px;
      color: #909399;
      font-size: 12px;
      border-top: 1px solid #f0f0f0;
    }
    .loading { text-align: center; padding: 30px; color: #409eff; }
    @media (max-width: 600px) {
      .cert-grid { grid-template-columns: 1fr; }
      .form-row { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>证书查询验证</h1>
      <p>国际职业能力标准人才评测网</p>
    </div>
    <div class="body">
      <div class="form-group">
        <label>证书编号</label>
        <input id="certNo" type="text" placeholder="请输入证书编号" autocomplete="off" />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>身份证号</label>
          <input id="idCard" type="text" placeholder="请输入身份证号" autocomplete="off" />
        </div>
        <div class="form-group">
          <label>姓名</label>
          <input id="name" type="text" placeholder="请输入姓名(按身份证查询时需填写)" autocomplete="off" />
        </div>
      </div>
      <div class="tip">提示:可仅凭"证书编号"查询;或凭"身份证号 + 姓名"查询。仅已绑定模板的证书可查询到。</div>
      <button class="btn-search" id="btnSearch" onclick="doSearch()">查 询</button>

      <div class="result-area" id="resultArea">
        <div class="empty">请输入查询条件后点击"查询"</div>
      </div>
    </div>
    <div class="footer">
      Copyright &copy; <span id="year"></span> 国际职业能力标准人才评测网. All Rights Reserved.
    </div>
  </div>

  <script>
    // API 基地址:同源时为空(走 /api 前缀);可由后端反向代理
    var API_BASE = (function () {
      // 同源部署时直接用相对路径 /api
      return '/api'
    })()

    function $(id) { return document.getElementById(id) }
    $('year').textContent = new Date().getFullYear()

    // 从浏览器 URL 参数自动填入身份证号 / 证书编号 / 姓名
    function fillFromUrlParams() {
      var params = new URLSearchParams(window.location.search)
      var certNo = params.get('certNo') || params.get('certno') || params.get('cert_no') || ''
      var idCard = params.get('idCard') || params.get('idcard') || params.get('id_card') || ''
      var name = params.get('name') || ''
      if (certNo) $('certNo').value = decodeURIComponent(certNo)
      if (idCard) $('idCard').value = decodeURIComponent(idCard)
      if (name) $('name').value = decodeURIComponent(name)
      // 若 URL 带了查询参数,自动触发查询
      if (certNo || (idCard && name)) {
        doSearch()
      }
    }

    function doSearch() {
      var certNo = $('certNo').value.trim()
      var idCard = $('idCard').value.trim()
      var name = $('name').value.trim()

      if (!certNo && !(idCard && name)) {
        alert('请输入证书编号,或同时输入身份证号和姓名')
        return
      }

      var body = { page: 1, size: 50 }
      if (certNo) {
        body.certNo = certNo
      } else {
        body.idCard = idCard
        body.name = name
      }

      $('btnSearch').disabled = true
      $('resultArea').innerHTML = '<div class="loading">查询中...</div>'

      fetch(API_BASE + '/portal/certificate/search', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      })
        .then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status)
          return r.json()
        })
        .then(function (res) {
          var data = (res && res.data) || {}
          var records = data.records || []
          renderResults(records, body)
        })
        .catch(function (e) {
          $('resultArea').innerHTML = '<div class="empty">查询失败: ' + (e.message || '未知错误') + '</div>'
        })
        .finally(function () {
          $('btnSearch').disabled = false
        })
    }

    function escapeHtml(s) {
      if (s === null || s === undefined) return ''
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      })
    }

    function formatDate(s) {
      if (!s) return '-'
      return String(s).substring(0, 10)
    }

    function genderText(g) {
      return g === 1 ? '男' : g === 2 ? '女' : '-'
    }

    function renderResults(records, query) {
      if (!records.length) {
        $('resultArea').innerHTML = '<div class="empty">未查询到证书。请检查输入是否正确,或该证书尚未绑定模板。</div>'
        return
      }
      var html = ''
      for (var i = 0; i < records.length; i++) {
        var c = records[i]
        var dlParams = query.certNo
          ? 'certNo=' + encodeURIComponent(query.certNo)
          : 'idCard=' + encodeURIComponent(query.idCard) + '&name=' + encodeURIComponent(query.name)
        html += '<div class="cert-card">'
        html += '<div class="name-line"><span class="name">' + escapeHtml(c.name) + '</span><span class="cert-no">' + escapeHtml(c.certNo) + '</span></div>'
        html += '<div class="cert-grid">'
        html += '<div><span class="k">证书编号:</span> <span class="v">' + escapeHtml(c.certNo) + '</span></div>'
        html += '<div><span class="k">学员编号:</span> <span class="v">' + escapeHtml(c.studentNo) + '</span></div>'
        html += '<div><span class="k">身份证号:</span> <span class="v">' + escapeHtml(c.idCard) + '</span></div>'
        html += '<div><span class="k">性别:</span> <span class="v">' + genderText(c.gender) + '</span></div>'
        html += '<div><span class="k">职业名称:</span> <span class="v">' + escapeHtml(c.profession) + '</span></div>'
        html += '<div><span class="k">技能等级:</span> <span class="v">' + escapeHtml(c.skillLevel) + '</span></div>'
        html += '<div><span class="k">颁发日期:</span> <span class="v">' + formatDate(c.issueDate) + '</span></div>'
        html += '<div><span class="k">报单机构:</span> <span class="v">' + escapeHtml(c.agency) + '</span></div>'
        if (c.theoryScore) html += '<div><span class="k">理论成绩:</span> <span class="v">' + escapeHtml(c.theoryScore) + '</span></div>'
        if (c.practicalScore) html += '<div><span class="k">实操成绩:</span> <span class="v">' + escapeHtml(c.practicalScore) + '</span></div>'
        if (c.comprehensiveEvaluation) html += '<div><span class="k">综合测评:</span> <span class="v">' + escapeHtml(c.comprehensiveEvaluation) + '</span></div>'
        html += '</div>'
        html += '<div class="cert-actions">'
        html += '<a class="btn-dl" target="_blank" href="' + API_BASE + '/portal/certificate/download/' + c.id + '?format=image&' + dlParams + '">下载图片</a>'
        html += '<a class="btn-dl" target="_blank" href="' + API_BASE + '/portal/certificate/download/' + c.id + '?format=pdf&' + dlParams + '">下载PDF</a>'
        html += '</div>'
        html += '</div>'
      }
      $('resultArea').innerHTML = html
    }

    // 回车键触发查询
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.keyCode === 13) {
        e.preventDefault()
        doSearch()
      }
    })

    // 页面加载后自动填入 URL 参数
    fillFromUrlParams()
  </script>
</body>
</html>
