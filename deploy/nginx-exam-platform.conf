# =====================================================================
# 考试平台 Nginx 配置文件
# 域名: gjrccp.org.cn
# 
# 访问方式:
#   用户端:   https://gjrccp.org.cn/
#   管理后台: https://gjrccp.org.cn/admin/
# =====================================================================

# ---------- HTTP -> HTTPS 强制跳转 ----------
server {
    listen 80;
    server_name gjrccp.org.cn www.gjrccp.org.cn;
    return 301 https://$host$request_uri;
}

# ---------- 主站(用户端 + 管理后台共用一个域名) ----------
server {
    listen 443 ssl;
    http2 on;
    server_name gjrccp.org.cn www.gjrccp.org.cn;

    # === HTTPS 证书(腾讯云下载的 Nginx 版本) ===
    ssl_certificate     /etc/nginx/ssl/exam-platform/gjrccp.org.cn_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/exam-platform/gjrccp.org.cn.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ===== gzip 压缩 =====
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_vary on;
    gzip_proxied any;
    gzip_disable "msie6";
    # =====================

    # === 管理后台 (通过 /admin/ 路径访问) ===
    # ^~ 确保此 location 优先于底部的正则 location(~* \.js$ 等) 匹配
    # 否则 /admin/static/js/xxx.js 会被正则 location 拦截,导致从用户端目录找文件返回 404
    location ^~ /admin/ {
        alias /data/exam-platform/admin-web/dist/;
        try_files $uri $uri/ /admin/index.html;
    }

    # === 用户端前端 ===
    root /data/exam-platform/user-web/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # === API 接口反代到后端 Spring Boot (8080) ===
    # ^~ 确保优先于底部的正则 location,否则 /api/uploads/xxx.png 会被正则拦截导致 404
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 上传文件大小限制
        client_max_body_size 1500m;
        # 超时设置(考试/证书生成可能耗时较长)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # === 上传文件访问 ===
    # ^~ 同理,确保 /uploads/xxx.png 不被正则拦截
    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:8080/api/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
