# =====================================================================
# Nginx 配置 - 考试平台 (43.162.107.232, 无域名, IP直接访问)
# 部署位置: /etc/nginx/conf.d/exam-platform.conf
# =====================================================================

server {
    listen 80;
    server_name 43.162.107.232;

    # admin-web 管理后台 (静态文件在 dist/ 目录下)
    location /admin/ {
        alias /opt/exam-platform/admin-web/dist/;
        try_files $uri $uri/ /admin/index.html;
        index index.html;
    }

    # user-web 学员端 (静态文件在 dist/ 目录下)
    location / {
        root /opt/exam-platform/user-web/dist/;
        try_files $uri $uri/ /index.html;
        index index.html;
    }

    # 后端 API 代理
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1500m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 上传文件代理
    location /uploads/ {
        proxy_pass http://127.0.0.1:8080/api/uploads/;
    }
}
