# =====================================================================
# 考试平台 GitHub Actions 自动部署 (IP 访问版)
# ---------------------------------------------------------------------
# 触发条件: push 到 main 或 master 分支时自动执行
# 部署流程:
#   1. GitHub Actions 在云端构建后端 JAR + 两个前端 dist
#   2. 通过 SSH 上传构建产物到服务器 /opt/exam-platform/deploy-pkg/
#   3. 远程执行 deploy/remote-deploy.sh 完成部署
#
# 使用前必须配置 GitHub Secrets (仓库 Settings → Secrets and variables → Actions):
#   SERVER_HOST        - 服务器IP: 43.162.107.232
#   SERVER_USER        - SSH用户名: root
#   SSH_PRIVATE_KEY    - SSH私钥 (服务器上 cat ~/.ssh/id_rsa)
#   MYSQL_PASS         - 数据库root密码
#   JWT_SECRET         - JWT密钥 (至少40字符,随意生成)
# =====================================================================

name: Build and Deploy

on:
  push:
    branches: [ main, master ]
  # 支持手动触发 (Actions 页面 → Run workflow)
  workflow_dispatch:

# 同一时间只允许一个部署在运行,避免并发冲突
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ===== 1. 拉取代码 =====
      - name: Checkout code
        uses: actions/checkout@v4

      # ===== 2. 配置 Java 环境 =====
      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      # ===== 3. 配置 Node.js 环境 =====
      - name: Setup Node.js 16
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: 'npm'
          cache-dependency-path: |
            admin-web/package.json
            user-web/package.json

      # ===== 4. 构建后端 JAR =====
      - name: Build Backend
        run: |
          cd backend
          mvn clean package -DskipTests -q
          JAR_FILE=$(find target -name "exam-platform-*.jar" -not -name "*-sources.jar" | head -1)
          echo "JAR file: $JAR_FILE"
          cp "$JAR_FILE" ../exam-platform-1.0.0.jar
          cd ..

      # ===== 5. 构建管理后台前端 =====
      - name: Build Admin Web
        run: |
          cd admin-web
          npm install --legacy-peer-deps
          NODE_ENV=production npm run build
          cd ..
          tar -czf admin-web-dist.tar.gz -C admin-web/dist .

      # ===== 6. 构建用户端前端 =====
      - name: Build User Web
        run: |
          cd user-web
          npm install --legacy-peer-deps
          NODE_ENV=production npm run build
          cd ..
          tar -czf user-web-dist.tar.gz -C user-web/dist .

      # ===== 7. 准备部署文件 =====
      - name: Prepare deploy files
        run: |
          cp deploy/remote-deploy.sh .
          chmod +x remote-deploy.sh
          cp deploy/daily-backup.sh .
          chmod +x daily-backup.sh
          cp backend/sql/upgrade_all.sql .
          # 一次性数据修复SQL已全部执行完毕,不再打包到部署流程
          # 如需重新执行,请在服务器上手动 mysql < xxx.sql
          # - fix_all_cert_issues.sql, fix_publish_time.sql, fix_publish_time_v2.sql
          # - fix_id_card_empty.sql, fix_zy_scores.sql, fix_issue_date_v2.sql
          # - import_missing_certs.sql, fix_dup_certs.sql

      # ===== 8. 打包所有部署产物 =====
      - name: Create deployment package
        run: |
          mkdir -p deploy-pkg
          mv exam-platform-1.0.0.jar deploy-pkg/
          mv admin-web-dist.tar.gz deploy-pkg/
          mv user-web-dist.tar.gz deploy-pkg/
          mv remote-deploy.sh deploy-pkg/
          mv daily-backup.sh deploy-pkg/
          mv upgrade_all.sql deploy-pkg/
          tar -czf deployment.tar.gz deploy-pkg/
          ls -lh deployment.tar.gz

      # ===== 9. 配置 SSH =====
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      # ===== 10. 上传部署包到服务器 =====
      - name: Upload deployment package
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "mkdir -p /opt/exam-platform/deploy-pkg"
          scp deployment.tar.gz ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/exam-platform/deploy-pkg/

      # ===== 11. 远程执行部署 =====
      - name: Deploy on server
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "cd /opt/exam-platform/deploy-pkg && \
             tar -xzf deployment.tar.gz && \
             cd deploy-pkg && \
             MYSQL_PASS='${{ secrets.MYSQL_PASS }}' \
             JWT_SECRET='${{ secrets.JWT_SECRET }}' \
             bash remote-deploy.sh"

      # ===== 12. 清理 =====
      - name: Cleanup
        if: always()
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "rm -rf /opt/exam-platform/deploy-pkg/deployment.tar.gz" || true
