<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="icon" href="<%= BASE_URL %>images/1756976082837900.png">
  <title>中国人力资源专业技能人才评价中心</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
</head>

<body>
  <noscript>
    <strong>很抱歉，本平台需要启用 JavaScript 才能正常运行，请先启用 JavaScript。</strong>
  </noscript>
  <script>
    // 证书查询参数跳转:在 Vue 加载前检测 URL 参数,直接跳转到证书查询页
    // 支持 bh(证书编号)/certNo/name/idCard 参数
    (function() {
      var search = window.location.search;
      var path = window.location.pathname;
      if (path === '/' || path === '/index.html') {
        var params = new URLSearchParams(search);
        var bh = params.get('bh');
        var certNo = params.get('certNo');
        var name = params.get('name');
        var idCard = params.get('idCard');
        if (bh || certNo || name || (idCard && name)) {
          window.location.replace('/certificate' + search);
          return;
        }
      }
    })();
  </script>
  <div id="app"></div>
</body>

</html>
