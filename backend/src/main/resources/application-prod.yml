# =====================================================================
# 生产环境后端配置
# 部署: 43.162.107.232 (IP直接访问,无域名)
# 启动: java -jar exam-platform.jar --spring.profiles.active=prod
# =====================================================================

server:
  port: 8080
  servlet:
    context-path: /api

spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/exam_platform?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: YOUR_MYSQL_ROOT_PASSWORD
  servlet:
    multipart:
      max-file-size: 1500MB
      max-request-size: 1500MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      adjust-dates-to-context-time-zone: true

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.exam.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: exam-platform-jwt-secret-43-162-107-232-2026-random-key
  expiration: 86400000

upload:
  path: /data/exam-platform/uploads
  access-prefix: http://43.162.107.232/api/uploads/

async:
  task:
    retention-days: 7
    zombie-hours: 2

# =====================================================================
# 直播配置(生产环境请在服务器上填真实鉴权Key)
# 域名: push.zgrlosta.org.cn / play.zgrlosta.org.cn
# 切换云厂商: live.provider = tencent | aliyun
# =====================================================================
live:
  provider: tencent
  app-name: live
  push-host: push.zgrlosta.org.cn
  play-host: play.zgrlosta.org.cn
  # 录制回调校验密钥(云厂商回调URL中带 ?key=xxx, 与 GitHub Secret CALLBACK_SECRET 一致)
  callback-secret: "YOUR_CALLBACK_SECRET"
  tencent:
    # 腾讯云直播控制台-推流配置中的 Key
    push-key: "YOUR_TENCENT_PUSH_KEY"
    # 腾讯云直播控制台-播放配置中的 Key
    play-key: "YOUR_TENCENT_PLAY_KEY"
    push-valid-seconds: 86400
    play-valid-seconds: 172800
  aliyun:
    # 阿里云直播控制台-推流域名鉴权配置中的主Key
    auth-key: "YOUR_ALIYUN_AUTH_KEY"
    valid-seconds: 86400

logging:
  level:
    com.exam: info
  file:
    name: /data/exam-platform/logs/exam-platform.log
