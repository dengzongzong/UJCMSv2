# =====================================================================
# 生产环境后端配置
# 域名: gjrccp.org.cn
# 部署时修改数据库密码和JWT密钥
# 启动: java -jar exam-platform.jar --spring.profiles.active=prod
# =====================================================================

server:
  port: 8080
  servlet:
    context-path: /api

spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/exam_platform?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true
    username: exam_user
    password: 修改成你的数据库密码
  servlet:
    multipart:
      max-file-size: 1500MB
      max-request-size: 1500MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      adjust-dates-to-context-time-zone: true

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.exam.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: 修改成你的随机密钥字符串至少40个字符
  expiration: 86400000

upload:
  path: /data/exam-platform/uploads
  access-prefix: https://gjrccp.org.cn/api/uploads/

async:
  task:
    retention-days: 7
    zombie-hours: 2

logging:
  level:
    com.exam: info
  file:
    name: /data/exam-platform/logs/exam-platform.log
