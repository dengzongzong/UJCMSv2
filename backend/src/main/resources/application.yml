server:
  port: 8080
  servlet:
    context-path: /api

spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/exam_platform?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull
    username: exam_user
    password: Test_1234
  servlet:
    multipart:
      max-file-size: 1500MB
      max-request-size: 1500MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      adjust-dates-to-context-time-zone: true

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.exam.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: exam-platform-secret-key-2026-very-long
  expiration: 86400000

upload:
  path: /data/exam-platform/uploads
  # 文件访问前缀(浏览器/前端拼 URL 用,生成证书时把物理路径转成 URL 时用到)
  # 注意:要与 server.servlet.context-path(=/api)保持一致
  access-prefix: http://localhost:8080/api/uploads/

async:
  task:
    # 异步任务完成/失败后保留天数,超过会自动清理
    retention-days: 7
    # 超过该小时数仍处于 RUNNING 的任务会被判定为"僵尸",允许重试
    zombie-hours: 2

live:
  # 云厂商: tencent(腾讯云) | aliyun(阿里云)
  provider: tencent
  # 推拉流路径中的应用名
  app-name: live
  push-host: push.zgrlosta.org.cn
  play-host: play.zgrlosta.org.cn
  # 录制回调校验密钥(云厂商回调URL中带 ?key=xxx, 留空则不校验)
  callback-secret: ""
  tencent:
    # 推流鉴权Key(腾讯云直播控制台-推流配置获取)
    push-key: ""
    # 播放鉴权Key(腾讯云直播控制台-播放配置获取)
    play-key: ""
    push-valid-seconds: 86400
    play-valid-seconds: 172800
  aliyun:
    # 鉴权主Key(阿里云直播控制台-推流域名/播放域名-鉴权配置获取)
    auth-key: ""
    valid-seconds: 86400

# =====================================================================
# 课程支付配置
# channel: wechat(微信Native) | alipay(支付宝当面付) | both(双通道)
# 回调地址固定为: {callback-base}/public/pay/callback/{channel}
# 生产环境密钥由部署脚本从环境变量注入, 本地开发可在此直接填沙箱密钥
# =====================================================================
pay:
  channel: both
  callback-base: https://zgrlosta.org.cn/api
  wechat:
    # 微信商户号
    mch-id: ""
    # 商户关联的 AppID(公众号/小程序)
    app-id: ""
    # APIv3 密钥(32位, 微信商户平台-API安全)
    api-v3-key: ""
    # 商户API证书序列号(商户平台-API安全-API证书)
    merchant-serial-no: ""
    # 商户API私钥(PKCS8 PEM 格式, 多行用 \n 或双引号包裹)
    merchant-private-key: ""
    # 微信支付平台证书公钥(PEM, 用于回调验签; 留空则跳过验签, 生产建议配置)
    platform-public-key: ""
  alipay:
    # 支付宝开放平台应用 AppID
    app-id: ""
    # 应用私钥(PKCS8 PEM)
    private-key: ""
    # 支付宝公钥
    alipay-public-key: ""
    # 网关(沙箱: https://openapi.alipaydev.com/gateway.do)
    gateway: https://openapi.alipay.com/gateway.do

logging:
  level:
    com.exam: debug
