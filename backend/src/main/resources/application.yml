server:
  port: 8080
  servlet:
    context-path: /api

spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/exam_platform?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull
    username: exam_user
    password: Test_1234
  servlet:
    multipart:
      max-file-size: 1500MB
      max-request-size: 1500MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      adjust-dates-to-context-time-zone: true

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.exam.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: exam-platform-secret-key-2026-very-long
  expiration: 86400000

upload:
  path: /data/exam-platform/uploads
  # 文件访问前缀(浏览器/前端拼 URL 用,生成证书时把物理路径转成 URL 时用到)
  # 注意:要与 server.servlet.context-path(=/api)保持一致
  access-prefix: http://localhost:8080/api/uploads/

async:
  task:
    # 异步任务完成/失败后保留天数,超过会自动清理
    retention-days: 7
    # 超过该小时数仍处于 RUNNING 的任务会被判定为"僵尸",允许重试
    zombie-hours: 2

logging:
  level:
    com.exam: debug
